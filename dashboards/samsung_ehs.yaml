# Samsung EHS dashboard
#
# 1. Settings > Dashboards > Add dashboard > New dashboard from scratch, name it "Samsung EHS".
# 2. Open it, then: pencil (edit) > three dots > Raw configuration editor.
# 3. Replace everything with this file and save.
#
# Entity IDs assume the default device name "Samsung EHS". If yours differ, search & replace
# "samsung_ehs" below.
#
# The heating curve chart needs ApexCharts card (HACS: "apexcharts-card"). Without it,
# delete the card with "type: custom:apexcharts-card"; everything else uses built-in cards.
# On a heating-only system, delete the "Hot water" section.

views:
- title: Samsung EHS
  path: samsung-ehs
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Heating
      icon: mdi:radiator
    - type: tile
      entity: climate.samsung_ehs
      name: Thermostat
      grid_options:
        columns: full
      features:
      - type: target-temperature
      - type: climate-preset-modes
        style: icons
        preset_modes:
        - none
        - boost
    - type: tile
      entity: sensor.samsung_ehs_flow_temperature
      name: Flow
    - type: tile
      entity: sensor.samsung_ehs_return_temperature
      name: Return
    - type: tile
      entity: binary_sensor.samsung_ehs_compressor
      name: Compressor
    - type: tile
      entity: binary_sensor.samsung_ehs_defrost
      name: Defrost
    - type: tile
      entity: button.samsung_ehs_boost_heating
      name: Boost 1 h
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.samsung_ehs_boost_heating
    - type: tile
      entity: button.samsung_ehs_cancel_boost
      name: Cancel boost
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.samsung_ehs_cancel_boost
  - type: grid
    cards:
    - type: heading
      heading: Weather compensation
      icon: mdi:weather-partly-cloudy
    - type: tile
      entity: sensor.samsung_ehs_outdoor_temperature
      name: Outdoor
    - type: tile
      entity: sensor.samsung_ehs_flow_target
      name: Flow target
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      header:
        show: true
        title: 'Heating curve: set vs learned'
      graph_span: 1d
      update_interval: 1min
      yaxis:
      - min: 20
        max: 50
        decimals: 0
      apex_config:
        chart:
          height: 300
        legend:
          show: true
        markers:
          size:
          - 0
          - 0
          - 7
        stroke:
          dashArray:
          - 5
          - 0
          - 0
        xaxis:
          type: numeric
          tickAmount: 6
          labels:
            formatter: |
              EVAL:function (v, t, o) {
                const LO = -10, HI = 20, g = o.w.globals;
                return Math.round(LO + (v - g.minX) / (g.maxX - g.minX) * (HI - LO)) + '°';
              }
        tooltip:
          x:
            formatter: |
              EVAL:function (v, o) {
                const LO = -10, HI = 20, g = o.w.globals;
                return 'Outdoor ' + (LO + (v - g.minX) / (g.maxX - g.minX) * (HI - LO)).toFixed(1) + ' °C';
              }
      series:
      - entity: sensor.samsung_ehs_learned_curve_offset
        name: Set curve
        color: '#9e9e9e'
        data_generator: |
          const LO = -10, HI = 20, t0 = start.getTime(), w = end.getTime() - t0;
          return (entity.attributes.curve || [])
            .filter((p) => p.outdoor >= LO && p.outdoor <= HI)
            .map((p) => [t0 + (p.outdoor - LO) / (HI - LO) * w, p.set]);
        extend_to: false
        show:
          legend_value: false
      - entity: sensor.samsung_ehs_learned_curve_offset
        name: Learned curve
        color: '#ff7043'
        data_generator: |
          const LO = -10, HI = 20, t0 = start.getTime(), w = end.getTime() - t0;
          return (entity.attributes.curve || [])
            .filter((p) => p.outdoor >= LO && p.outdoor <= HI)
            .map((p) => [t0 + (p.outdoor - LO) / (HI - LO) * w, p.learned]);
        extend_to: false
        show:
          legend_value: false
      - entity: sensor.samsung_ehs_flow_target
        name: Flow target now
        color: '#29b6f6'
        data_generator: |
          const LO = -10, HI = 20, t0 = start.getTime(), w = end.getTime() - t0;
          const x = entity.attributes.effective_outdoor;
          if (x == null || entity.state === 'unavailable') return [];
          return [[t0 + (Math.min(HI, Math.max(LO, x)) - LO) / (HI - LO) * w, Number(entity.state)]];
        extend_to: false
        show:
          legend_value: false
    - type: tile
      entity: sensor.samsung_ehs_learned_flow_at_cold_end
      name: 'Learned: cold end'
    - type: tile
      entity: sensor.samsung_ehs_learned_flow_at_mild_end
      name: 'Learned: mild end'
    - type: history-graph
      title: Learned curve ends, last 7 days
      hours_to_show: 168
      grid_options:
        columns: full
      entities:
      - entity: sensor.samsung_ehs_learned_flow_at_cold_end
        name: Cold end
      - entity: sensor.samsung_ehs_learned_flow_at_mild_end
        name: Mild end
  - type: grid
    cards:
    - type: heading
      heading: Hot water
      icon: mdi:water-boiler
    - type: tile
      entity: water_heater.samsung_ehs_hot_water
      name: Hot water
      grid_options:
        columns: full
      features:
      - type: water-heater-operation-modes
        operation_modes:
        - 'off'
        - eco
        - standard
        - performance
    - type: tile
      entity: button.samsung_ehs_boost_hot_water
      name: Boost 1 h
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.samsung_ehs_boost_hot_water
    - type: tile
      entity: button.samsung_ehs_cancel_hot_water_boost
      name: Cancel boost
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.samsung_ehs_cancel_hot_water_boost
  - type: grid
    cards:
    - type: heading
      heading: Performance
      icon: mdi:lightning-bolt
    - type: tile
      entity: sensor.samsung_ehs_electrical_power
      name: Power in
    - type: tile
      entity: sensor.samsung_ehs_heat_output
      name: Heat out
    - type: tile
      entity: sensor.samsung_ehs_cop
      name: COP now
    - type: tile
      entity: sensor.samsung_ehs_cop_today
      name: COP today
    - type: tile
      entity: sensor.samsung_ehs_electrical_energy_today
      name: Energy in today
    - type: tile
      entity: sensor.samsung_ehs_heat_energy_today
      name: Heat out today
    - type: statistics-graph
      title: COP vs outdoor temperature, hourly
      grid_options:
        columns: full
      days_to_show: 3
      period: hour
      stat_types:
      - mean
      chart_type: line
      entities:
      - entity: sensor.samsung_ehs_cop
        name: COP
      - entity: sensor.samsung_ehs_outdoor_temperature
        name: Outdoor
